<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="app-version" content="__APP_VERSION__" />
    <title>Oasis Board</title>
    <link rel="manifest" href="manifest.webmanifest?v=__APP_VERSION__" />
    <link rel="apple-touch-icon" href="icons/icon-192.png?v=__APP_VERSION__" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=__APP_VERSION__" />
    <link rel="stylesheet" href="styles.css?v=__APP_VERSION__" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>Oasis Board</h1>
      </header>

      <nav class="view-tabs" aria-label="Views">
        <button id="backlogTab" class="tab-btn" data-view="backlog" type="button">Backlog</button>
        <button id="boardTab" class="tab-btn active" data-view="board" type="button">Board</button>
        <button id="historyTab" class="tab-btn" data-view="history" type="button">Historial</button>
      </nav>

      <div id="pullRefresh" class="pull-refresh" aria-hidden="true">
        <div class="pull-refresh-spinner"></div>
      </div>

      <main id="boardView" class="view-panel active">
        <div class="board" id="board">
          <section class="column" data-column="todo">
            <div class="column-head">
              <h2>To Do</h2>
              <button class="add-card-btn" data-column="todo" type="button" aria-label="Add card to To Do">+</button>
            </div>
            <div class="card-list" id="todoList"></div>
          </section>
          <section class="column" data-column="doing">
            <div class="column-head">
              <h2>Doing</h2>
              <button class="add-card-btn" data-column="doing" type="button" aria-label="Add card to Doing">+</button>
            </div>
            <div class="card-list" id="doingList"></div>
          </section>
          <section class="column" data-column="done">
            <div class="column-head">
              <h2>Done</h2>
              <button class="add-card-btn" data-column="done" type="button" aria-label="Add card to Done">+</button>
            </div>
            <div class="card-list" id="doneList"></div>
          </section>
        </div>
      </main>

      <section id="backlogView" class="view-panel" aria-label="Backlog view">
        <div class="panel-wrap">
          <div class="column-head">
            <h2>Backlog</h2>
            <button class="add-card-btn" data-column="backlog" type="button" aria-label="Add card to Backlog">+</button>
          </div>
          <p class="panel-note">Backlog is now a dedicated column for queued work.</p>
          <div class="card-list" id="backlogList"></div>
        </div>
      </section>

      <section id="historyView" class="view-panel" aria-label="History view">
        <div class="panel-wrap">
          <div class="column-head">
            <h2>Historial</h2>
            <button class="add-card-btn" data-column="history" type="button" aria-label="Add card to Historial">+</button>
          </div>
          <p class="panel-note">Cards can be moved here manually, and Done cards older than 2 days are auto-archived here.</p>
          <div class="card-list" id="historyList"></div>
        </div>
      </section>

      <footer class="app-footer" aria-live="polite">
        <span id="runtimeVersion">v__APP_VERSION__</span>
      </footer>
    </div>

    <dialog id="cardDialog" aria-labelledby="dialogTitle" tabindex="-1">
      <form id="cardForm" method="dialog">
        <h3 id="dialogTitle">New Card</h3>
        <label>
          Title
          <input id="titleInput" type="text" required maxlength="120" />
        </label>
        <label>
          Description (optional)
          <textarea id="descInput" rows="3" maxlength="500"></textarea>
        </label>

        <label>
          Column
          <select id="columnInput">
            <option value="backlog">Backlog</option>
            <option value="todo">To Do</option>
            <option value="doing">Doing</option>
            <option value="done">Done</option>
            <option value="history">Historial</option>
          </select>
        </label>

        <label>
          Company
          <select id="companyInput">
            <option value="otc">The OTC Desk</option>
            <option value="vault">Oasis Vault</option>
            <option value="otros">Otros</option>
          </select>
        </label>

        <div class="checklist-editor">
          <div class="checklist-header">
            <span>Checklist</span>
            <button type="button" id="addItemBtn">+ Add item</button>
          </div>
          <div id="editChecklist"></div>
        </div>

        <menu>
          <button type="button" id="cancelBtn">Cancel</button>
          <button id="saveBtn" class="primary" value="default">Save</button>
        </menu>
      </form>
    </dialog>

    <template id="cardTemplate">
      <article class="card" draggable="true">
        <div class="card-top">
          <div class="card-heading">
            <h3 class="card-title"></h3>
            <span class="card-company-label"></span>
          </div>
          <div class="card-actions">
            <button
              class="advance-btn"
              type="button"
              aria-label="Mover a siguiente etapa"
              title="Mover a siguiente etapa"
            >
              <span class="advance-icon" aria-hidden="true"></span>
            </button>
            <button class="edit-btn" type="button" aria-label="Edit card" title="Edit card">⚙</button>
          </div>
        </div>
        <p class="card-desc"></p>
        <ul class="checklist"></ul>
      </article>
    </template>

    <script>
      window.APP_VERSION = '__APP_VERSION__';
    </script>
    <script src="app.js?v=__APP_VERSION__"></script>
  </body>
</html>
