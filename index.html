<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Oasis Board</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Oasis Board</h1>
      <button id="newCardBtn" class="primary">+ New Card</button>
    </header>

    <main class="board" id="board">
      <section class="column" data-column="todo">
        <h2>To Do</h2>
        <div class="card-list" id="todoList"></div>
      </section>
      <section class="column" data-column="doing">
        <h2>Doing</h2>
        <div class="card-list" id="doingList"></div>
      </section>
      <section class="column" data-column="done">
        <h2>Done</h2>
        <div class="card-list" id="doneList"></div>
      </section>
    </main>

    <dialog id="cardDialog">
      <form id="cardForm" method="dialog">
        <h3 id="dialogTitle">New Card</h3>
        <label>
          Title
          <input id="titleInput" type="text" required maxlength="120" />
        </label>
        <label>
          Description (optional)
          <textarea id="descInput" rows="3" maxlength="500"></textarea>
        </label>

        <div class="checklist-editor">
          <div class="checklist-header">
            <span>Checklist</span>
            <button type="button" id="addItemBtn">+ Add item</button>
          </div>
          <div id="editChecklist"></div>
        </div>

        <menu>
          <button type="button" id="cancelBtn">Cancel</button>
          <button id="saveBtn" class="primary" value="default">Save</button>
        </menu>
      </form>
    </dialog>

    <template id="cardTemplate">
      <article class="card" draggable="true">
        <div class="card-top">
          <h3 class="card-title"></h3>
          <div class="card-actions">
            <button class="move-toggle-btn" type="button" aria-expanded="false">Move</button>
            <button class="edit-btn" type="button">Edit</button>
          </div>
        </div>
        <div class="move-menu" hidden>
          <button type="button" data-move="todo">To Do</button>
          <button type="button" data-move="doing">Doing</button>
          <button type="button" data-move="done">Done</button>
        </div>
        <p class="card-desc"></p>
        <ul class="checklist"></ul>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
